<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    <linearGradient id="preservedAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="redLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="greenLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="760" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header & Title -->
  <text x="32" y="38" fill="#38d9a9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.2">REPOTWIN V0.3.0 · CONTEXT COMPOUNDING IMPACT</text>
  <text x="32" y="64" fill="#f8fafc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800">Active Context Window: Raw Terminal vs. RepoTwin Twin Sieve</text>

  <!-- Legend -->
  <g transform="translate(420, 26)">
    <!-- Red legend -->
    <circle cx="10" cy="10" r="5" fill="#ef4444" />
    <text x="22" y="14" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Without RepoTwin (Raw O(N²))</text>
    
    <!-- Green legend -->
    <circle cx="180" cy="10" r="5" fill="#10b981" />
    <text x="192" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">With RepoTwin (~75% Saved)</text>
  </g>

  <!-- Grid lines & Axis Labels -->
  <!-- Y-Axis (Tokens) -->
  <g stroke="#1e293b" stroke-dasharray="3 3" opacity="0.7">
    <line x1="70" y1="90" x2="710" y2="90" />
    <line x1="70" y1="140" x2="710" y2="140" />
    <line x1="70" y1="190" x2="710" y2="190" />
    <line x1="70" y1="240" x2="710" y2="240" />
    <line x1="70" y1="290" x2="710" y2="290" />
  </g>

  <g fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">
    <text x="60" y="94">40k</text>
    <text x="60" y="144">30k</text>
    <text x="60" y="194">20k</text>
    <text x="60" y="244">10k</text>
    <text x="60" y="294">0k</text>
  </g>

  <!-- Shaded Area between curves -->
  <!-- Curve Raw points: (110,270) -> (250,230) -> (390,175) -> (530,110) -> (670,45) -->
  <!-- Curve Twin points: (670,248) -> (530,253) -> (390,259) -> (250,264) -> (110,270) -->
  <path d="M 110 270 
           C 180 260, 210 240, 250 230 
           C 290 220, 350 190, 390 175 
           C 430 160, 490 130, 530 110 
           C 570 90, 630 60, 670 45 
           L 670 248 
           C 630 250, 570 252, 530 253 
           C 490 254, 430 257, 390 259 
           C 350 261, 290 263, 250 264 
           L 110 270 Z" 
        fill="url(#preservedAreaGrad)" />

  <!-- Badge inside shaded area -->
  <g transform="translate(460, 160)">
    <rect width="170" height="30" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.2" opacity="0.95" />
    <text x="85" y="19" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">⚡ 75% TOKENS PRESERVED</text>
  </g>

  <!-- Red Curve (Without RepoTwin) -->
  <path d="M 110 270 C 180 260, 210 240, 250 230 C 290 220, 350 190, 390 175 C 430 160, 490 130, 530 110 C 570 90, 630 60, 670 45" 
        fill="none" stroke="url(#redLineGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Green Curve (With RepoTwin) -->
  <path d="M 110 270 C 180 268, 210 266, 250 264 C 290 262, 350 260, 390 259 C 430 256, 490 254, 530 253 C 570 250, 630 249, 670 248" 
        fill="none" stroke="url(#greenLineGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glowGreen)" />

  <!-- Data Points on Red Curve -->
  <circle cx="110" cy="270" r="5" fill="#ef4444" stroke="#090d16" stroke-width="2" />
  <circle cx="250" cy="230" r="5" fill="#ef4444" stroke="#090d16" stroke-width="2" />
  <circle cx="390" cy="175" r="5" fill="#ef4444" stroke="#090d16" stroke-width="2" />
  <circle cx="530" cy="110" r="5" fill="#ef4444" stroke="#090d16" stroke-width="2" />
  <circle cx="670" cy="45" r="6" fill="#f87171" stroke="#ef4444" stroke-width="3" />
  <text x="670" y="32" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">~38,000 tks</text>

  <!-- Data Points on Green Curve -->
  <circle cx="110" cy="270" r="5" fill="#10b981" stroke="#090d16" stroke-width="2" />
  <circle cx="250" cy="264" r="5" fill="#10b981" stroke="#090d16" stroke-width="2" />
  <circle cx="390" cy="259" r="5" fill="#10b981" stroke="#090d16" stroke-width="2" />
  <circle cx="530" cy="253" r="5" fill="#10b981" stroke="#090d16" stroke-width="2" />
  <circle cx="670" cy="248" r="6" fill="#34d399" stroke="#10b981" stroke-width="3" />
  <text x="670" y="274" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">~8,400 tks</text>

  <!-- X-Axis Labels (Turns) -->
  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    <text x="110" y="320">Turn 1</text>
    <text x="110" y="335" fill="#64748b" font-size="9.5">Prompt</text>

    <text x="250" y="320">Turn 2</text>
    <text x="250" y="335" fill="#64748b" font-size="9.5">Test 1 Fail</text>

    <text x="390" y="320">Turn 3</text>
    <text x="390" y="335" fill="#64748b" font-size="9.5">Test 2 Fail</text>

    <text x="530" y="320">Turn 4</text>
    <text x="530" y="335" fill="#64748b" font-size="9.5">Test 3 Fail</text>

    <text x="670" y="320">Turn 5</text>
    <text x="670" y="335" fill="#10b981" font-size="9.5" font-weight="700">All Tests Pass</text>
  </g>
</svg>
